<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Achievements · SkillTrack</title><link rel="stylesheet" href="css/style.css"></head><body><div class="layout"><aside class="side"><a class="brand" href="dashboard.html">SkillTrack</a><nav class="nav"><a href="dashboard.html">Overview</a><a href="skills.html">Skills</a><a href="courses.html">Courses</a><a href="certifications.html">Certificates</a><a class="active" href="achievements.html">Achievements</a><a href="resume.html">Resume Builder</a><a href="achievement-report.html">Achievement Report</a><a href="workshops.html">Workshops</a></nav></aside><main class="main"><div class="top"><div><div class="label">STUDENT PROGRESS</div><h1>Achievements</h1></div><button id="logoutButton" class="btn secondary">Sign out</button></div><section class="card"><div class="label">TOTAL POINTS</div><div id="points" class="metric">—</div><div id="message" class="alert"></div></section><section class="section card"><div class="section-head"><h2>Earned badges</h2><button id="reconcileButton" class="btn secondary">Refresh achievements</button></div><div id="rows" class="cards"></div></section></main></div><script src="js/api.js"></script><script>const sessionData=requireSession();document.querySelector('#logoutButton').onclick=()=>window.logout();const rows=document.querySelector('#rows'),message=document.querySelector('#message');async function load(reconcile=false){try{const data=await api('/achievements'+(reconcile?'/reconcile':''),reconcile?{method:'POST'}:{});document.querySelector('#points').textContent=data.points;rows.innerHTML=data.items.length?data.items.map(x=>'<article class="card"><h3>'+x.title+'</h3><p class="subtle">'+(x.description||'')+'</p><div class="label">'+x.points+' points · '+new Date(x.awardedAt).toLocaleDateString()+'</div></article>').join(''):'<div class="empty">No achievements yet. Add skills, courses, certificates, or goals to earn badges.</div>'}catch(e){message.textContent=e.message;message.style.display='block'}}document.querySelector('#reconcileButton').onclick=()=>load(true);load();</script></body></html>
