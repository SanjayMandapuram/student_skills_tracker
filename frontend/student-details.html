<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student details · SkillTrack</title><link rel="stylesheet" href="css/style.css"></head><body><div class="layout"><aside class="side"><a class="brand" href="admin-dashboard.html">✦ SkillTrack</a><nav class="nav"><a href="admin-dashboard.html">◈ &nbsp;Overview</a><a class="active" href="students.html">♙ &nbsp;Students</a></nav></aside><main class="main"><div class="top"><div><div class="label">STUDENT DETAILS</div><h1 id="name">Loading…</h1></div><a class="btn secondary" href="students.html">Back to students</a></div><div id="profile" class="card"></div><section class="section card"><h2>Skills</h2><div id="skills" class="subtle"></div></section><section class="section card"><h2>Courses</h2><div id="courses" class="subtle"></div></section><section class="section card"><h2>Certificates</h2><div class="table-wrap"><table class="table"><thead><tr><th>Name</th><th>Issuer</th><th>Status</th><th>Remarks</th></tr></thead><tbody id="certs"></tbody></table></div></section></main></div><script src="js/api.js"></script><script>const s=requireSession();if(s.user.role!=='ADMIN')logout();const id=new URLSearchParams(location.search).get('id');async function load(){const d=await api('/admin/users/'+id),u=d.student;document.querySelector('#name').textContent=u.name;document.querySelector('#profile').innerHTML='<p><b>Email:</b> '+u.email+'</p><p><b>Department:</b> '+(u.department||'—')+' &nbsp; <b>Branch:</b> '+(u.branch||'—')+' &nbsp; <b>Year:</b> '+(u.academicYear||'—')+'</p><p><b>Institution:</b> '+(u.institution||'—')+'</p>';document.querySelector('#skills').textContent=d.skills.map(x=>x.skillName+' ('+x.proficiency+')').join(' · ')||'No skills recorded.';document.querySelector('#courses').textContent=d.courses.map(x=>x.courseName+' · '+x.provider).join(' · ')||'No courses recorded.';document.querySelector('#certs').innerHTML=d.certifications.length?d.certifications.map(x=>'<tr><td>'+x.certificationName+'</td><td>'+x.issuingOrganization+'</td><td><span class="badge '+x.status+'">'+x.status+'</span></td><td>'+(x.reviewRemarks||'—')+'</td></tr>').join(''):'<tr><td colspan="4" class="empty">No certificates recorded.</td></tr>'}load().catch(e=>document.querySelector('#name').textContent=e.message);</script></body></html>
