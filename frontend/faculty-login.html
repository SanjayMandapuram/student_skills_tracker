<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Faculty sign in - SkillTrack</title><link rel="stylesheet" href="css/style.css"></head><body data-expected-role="FACULTY"><main class="auth-shell"><section class="hero"><div class="brand">SkillTrack - Faculty</div><h1>Review progress with confidence.</h1><p>Manage student records and verify learning credentials from one secure faculty console.</p></section><section class="auth-card"><div class="brand">Faculty / Admin access</div><h2>Sign in to the console</h2><p class="subtle">This area is restricted to faculty and administrators.</p><div class="alert"></div><form id="loginForm"><div class="field"><label>Email</label><input class="input" name="email" type="email" required placeholder="faculty@example.com"></div><div class="field"><label>Password</label><div style="display:flex;gap:8px"><input class="input" id="password" name="password" type="password" required><button type="button" class="btn secondary" onclick="togglePassword('password',this)">Show</button></div></div><label class="subtle"><input name="remember" type="checkbox"> Remember me</label><button class="btn" type="submit" style="width:100%;margin-top:18px">Sign in</button></form><p class="subtle" style="margin-top:24px"><a href="index.html">Student login</a></p></section></main><script src="js/api.js"></script><script src="js/auth.js"></script></body></html>
