<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Workshops · SkillTrack</title><link rel="stylesheet" href="css/style.css"></head><body><div class="layout"><aside class="side"><a class="brand" href="dashboard.html">SkillTrack</a><nav class="nav"><a href="dashboard.html">Overview</a><a class="active" href="workshops.html">Workshops</a></nav></aside><main class="main"><div class="top"><div><div class="label">LEARNING OPPORTUNITIES</div><h1>Workshops</h1></div><button id="logoutButton" class="btn secondary">Sign out</button></div><div id="message" class="alert"></div><section id="facultyForm" class="card" style="display:none"><h2>Publish a workshop</h2><form id="createForm" class="form-grid"><input class="input" name="title" required placeholder="Title"><input class="input" name="category" placeholder="Category"><input class="input" name="instructor" placeholder="Instructor"><input class="input" name="venue" placeholder="Venue or meeting link"><input class="input" name="startAt" type="datetime-local" required><input class="input" name="endAt" type="datetime-local" required><input class="input" name="registrationDeadline" type="datetime-local"><input class="input" name="capacity" type="number" min="1" placeholder="Capacity"><textarea class="input" name="description" placeholder="Description"></textarea><button class="btn" type="submit">Publish</button></form></section><section class="section card"><h2>Published workshops</h2><div id="rows" class="cards"></div></section></main></div><script src="js/api.js"></script><script>const s=requireSession();document.querySelector('#logoutButton').onclick=()=>window.logout();const faculty=['ADMIN','FACULTY'].includes(s.user.role);document.querySelector('#facultyForm').style.display=faculty?'block':'none';const msg=document.querySelector('#message');function show(t,ok=false){msg.textContent=t;msg.className='alert'+(ok?' success':'');msg.style.display='block'}async function load(){try{const rows=await api('/workshops');document.querySelector('#rows').innerHTML=rows.length?rows.map(x=>'<article class="card"><h3>'+x.title+'</h3><p class="subtle">'+(x.description||'')+'</p><p>'+new Date(x.startAt).toLocaleString()+' · '+(x.venue||'Online')+'</p>'+(!faculty?'<button class="btn" onclick="registerWorkshop('+x.id+')">Register</button>':'')+'</article>').join(''):'<div class="empty">No published workshops.</div>'}catch(e){show(e.message)}}async function registerWorkshop(id){try{await api('/workshops/'+id+'/register',{method:'POST'});show('Registration saved.',true)}catch(e){show(e.message)}}document.querySelector('#createForm').onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));d.status='PUBLISHED';d.capacity=d.capacity?Number(d.capacity):null;try{await api('/faculty/workshops',{method:'POST',body:JSON.stringify(d)});e.target.reset();show('Workshop published.',true);load()}catch(x){show(x.message)}};load();</script></body></html>
