<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Choose workspace - SkillTrack</title><link rel="stylesheet" href="css/style.css"></head><body><main class="auth-shell"><section class="hero"><div class="brand">SkillTrack</div><h1>Choose your workspace.</h1><p>Your account permissions decide which workspace you can enter.</p></section><section class="auth-card"><div class="brand">Workspace access</div><h2>Are you a Student or Faculty?</h2><p class="subtle">Choose the area you want to open.</p><div id="message" class="alert"></div><div class="cards" style="grid-template-columns:1fr;gap:12px"><button id="student" class="card" style="text-align:left;cursor:pointer"><h3>Student</h3><p class="subtle">Manage your profile, skills, courses and certificates.</p></button><button id="faculty" class="card" style="text-align:left;cursor:pointer"><h3>Faculty / Admin</h3><p class="subtle">Review student records and verify certificates.</p></button></div><p class="subtle" style="margin-top:24px"><a href="#" id="logout">Sign out</a></p></section></main><script src="js/api.js"></script><script>const s=requireSession(),m=document.querySelector('#message');document.querySelector('#logout').onclick=e=>{e.preventDefault();logout()};function choose(role,target){if(s.user.role!==role){m.textContent='This account is not authorized for this workspace.';m.style.display='block';return}go(target)}document.querySelector('#student').onclick=()=>choose('STUDENT','dashboard.html');document.querySelector('#faculty').onclick=()=>choose('ADMIN','faculty-verification.html');</script></body></html>
