<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profile · SkillTrack</title><link rel="stylesheet" href="css/style.css"></head><body><div class="layout"><aside class="side"><a class="brand" href="dashboard.html">✦ SkillTrack</a><nav class="nav"><a href="dashboard.html">◈ &nbsp;Overview</a><a class="active" href="profile.html">◎ &nbsp;Profile</a><a href="skills.html">✦ &nbsp;Skills</a><a href="courses.html">▣ &nbsp;Courses</a><a href="certifications.html">✓ &nbsp;Certifications</a></nav></aside><main class="main"><div class="top"><div><div class="label">YOUR IDENTITY</div><h1>Student profile</h1></div><button id="logout" class="btn secondary">Sign out</button></div><div class="card"><div class="alert"></div><form id="profileForm" class="form-grid"><div class="field"><label>Full name</label><input class="input" name="name" required></div><div class="field"><label>Email</label><input class="input" name="email" disabled></div><div class="field"><label>Phone</label><input class="input" name="phone"></div><div class="field"><label>Department</label><input class="input" name="department"></div><div class="field"><label>Course / branch</label><input class="input" name="branch"></div><div class="field"><label>Academic year</label><input class="input" name="academicYear" placeholder="2026-27"></div><div class="field"><label>College / institution</label><input class="input" name="institution"></div><div><button class="btn" type="submit">Save profile</button></div></form></div></main></div><script src="js/api.js"></script><script>const s=requireSession();document.querySelector('#logout').onclick=logout;const f=document.querySelector('#profileForm');async function load(){const u=await api('/users/me');for(const k of ['name','email','phone','department','branch','academicYear','institution'])if(f[k])f[k].value=u[k]||''}f.onsubmit=async e=>{e.preventDefault();const a=document.querySelector('.alert');try{const d=Object.fromEntries(new FormData(f));await api('/users/me',{method:'PUT',body:JSON.stringify(d)});a.textContent='Profile saved successfully.';a.className='alert success';a.style.display='block'}catch(x){a.textContent=x.message;a.style.display='block'}};load();</script></body></html>
