<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin · SkillTrack</title><link rel="stylesheet" href="css/style.css"></head><body><div class="layout"><aside class="side"><a class="brand" href="admin-dashboard.html">✦ SkillTrack</a><nav class="nav"><a class="active" href="admin-dashboard.html">◈ &nbsp;Overview</a><a href="#certs">✓ &nbsp;Verification</a><a href="#history">◷ &nbsp;History</a></nav></aside><main class="main"><div class="top"><div><div class="label">ADMIN CONSOLE</div><h1>Verification overview</h1></div><button id="logout" class="btn secondary">Sign out</button></div><div class="cards" id="metrics"></div><section id="certs" class="section card"><div class="section-head"><h2>Certification queue</h2></div><div class="table-wrap"><table class="table"><thead><tr><th>Student</th><th>Certification</th><th>Status</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div></section><section id="history" class="section card"><h2>Recent verification history</h2><div id="historyRows" class="subtle"></div></section></main></div><script src="js/api.js"></script><script>const s=requireSession();if(s.user.role!=='ADMIN')logout();document.querySelector('#logout').onclick=logout;async function load(){const r=await api('/admin/reports');document.querySelector('#metrics').innerHTML=Object.entries(r).map(([k,v])=>`<div class="card"><div class="label">${k}</div><div class="metric">${v}</div></div>`).join('');const rows=await api('/admin/certifications');document.querySelector('#rows').innerHTML=rows.length?rows.map(x=>`<tr><td>${x.studentName||''}</td><td>${x.certificationName}</td><td><span class="badge ${x.status}">${x.status}</span></td><td class="actions">${x.status==='PENDING'?`<button class="btn" onclick="review(${x.id},'verify')">Verify</button><button class="btn danger" onclick="review(${x.id},'reject')">Reject</button>`:'—'}</td></tr>`).join(''):`<tr><td colspan="4" class="empty">No certifications submitted yet.</td></tr>`;const h=await api('/admin/verification-history');document.querySelector('#historyRows').innerHTML=h.length?h.map(x=>`${x.studentName} · ${x.certificationName} · ${x.newStatus} · ${new Date(x.verifiedAt).toLocaleString()}<br>`).join(''):'No verification history yet.'}async function review(id,action){const remarks=action==='reject'?prompt('Reason for rejection:'):prompt('Optional remarks:');if(action==='reject'&&!remarks)return;await api('/admin/certifications/'+id+'/'+action,{method:'PUT',body:JSON.stringify({remarks:remarks||''})});load()}load();</script></body></html>
