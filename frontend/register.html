<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account · SkillTrack</title><link rel="stylesheet" href="css/style.css"></head><body><main class="auth-shell"><section class="hero"><div class="brand">✦ SkillTrack</div><h1>Your next milestone starts here.</h1><p>Choose the workspace that matches your permanent account role.</p></section><section class="auth-card"><div class="brand">Get started</div><h2>Create your account</h2><p class="subtle">Your account type is stored securely and cannot be changed from the browser.</p><div class="alert"></div><form id="registerForm"><div class="field"><label>Full name</label><input class="input" name="name" required maxlength="100" placeholder="Alex Johnson"></div><div class="field"><label>Email</label><input class="input" name="email" type="email" required placeholder="you@example.com"></div><div class="field"><label>Phone <span class="subtle">(optional)</span></label><input class="input" name="phone" placeholder="+91 98765 43210"></div><div class="field"><label>Account type</label><select class="input" name="role" id="role" required><option value="">Choose Student or Faculty</option><option value="STUDENT">Student — manage skills, courses and certificates</option><option value="FACULTY">Faculty — review students and verify certificates</option></select></div><div class="field" id="facultyCodeWrap" style="display:none"><label>Faculty access code</label><input class="input" name="facultyCode" id="facultyCode" type="password" autocomplete="off"><small class="subtle">Required to create a faculty account.</small></div><div class="form-grid"><div class="field"><label>Password</label><div style="display:flex;gap:8px"><input class="input" id="registerPassword" name="password" type="password" minlength="8" required><button type="button" class="btn secondary" onclick="togglePassword('registerPassword',this)">Show</button></div></div><div class="field"><label>Confirm password</label><input class="input" name="confirmPassword" type="password" minlength="8" required></div></div><button class="btn" type="submit" style="width:100%;margin-top:10px">Create account</button></form><p class="subtle" style="margin-top:24px">Already registered? <a href="index.html">Sign in</a></p></section></main><script>const role=document.querySelector('#role'),code=document.querySelector('#facultyCodeWrap');role.onchange=()=>{const faculty=role.value==='FACULTY';code.style.display=faculty?'block':'none';document.querySelector('#facultyCode').required=faculty};</script><script src="js/api.js"></script><script src="js/auth.js"></script></body></html>
