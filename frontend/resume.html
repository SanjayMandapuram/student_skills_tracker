<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Resume Builder · SkillTrack</title><link rel="stylesheet" href="css/style.css"></head><body><div class="layout"><aside class="side"><a class="brand" href="dashboard.html">SkillTrack</a><nav class="nav"><a href="dashboard.html">Overview</a><a href="profile.html">Profile</a><a class="active" href="resume.html">Resume Builder</a><a href="achievement-report.html">Achievement Report</a></nav></aside><main class="main"><div class="top"><div><div class="label">STUDENT TOOLS</div><h1>Resume Builder</h1></div><button id="logoutButton" class="btn secondary">Sign out</button></div><section class="card"><h2>Download your resume</h2><p class="subtle">Uses your saved profile, skills, completed courses, and approved certificates only.</p><div id="message" class="alert"></div><button id="downloadButton" class="btn">Generate PDF</button></section></main></div><script src="js/api.js"></script><script>requireSession();const logoutButton=document.querySelector('#logoutButton'),downloadButton=document.querySelector('#downloadButton'),message=document.querySelector('#message');logoutButton.onclick=()=>window.logout();downloadButton.onclick=async()=>{downloadButton.disabled=true;message.textContent='Generating…';message.style.display='block';try{const response=await fetch(API+'/reports/student/resume',{headers:authHeaders()});if(!response.ok)throw Error('Unable to generate resume');const blob=await response.blob(),link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download='resume.pdf';link.click();URL.revokeObjectURL(link.href);message.className='alert success';message.textContent='Resume downloaded.'}catch(error){message.textContent=error.message}finally{downloadButton.disabled=false}}</script></body></html>
