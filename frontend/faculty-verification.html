<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Faculty verification · SkillTrack</title><link rel="stylesheet" href="css/style.css"></head><body><main class="auth-shell"><section class="hero"><div class="brand">✦ SkillTrack · Restricted</div><h1>Faculty verification.</h1><p>Enter your faculty access code to continue to the secure verification console.</p></section><section class="auth-card"><div class="brand">🔐 Restricted faculty access</div><h2>Faculty Verification</h2><p class="subtle">Enter your faculty access code to continue.</p><div id="message" class="alert"></div><form id="verifyForm"><div class="field"><label>Faculty access code</label><div style="display:flex;gap:8px"><input class="input" id="code" name="code" type="password" required autocomplete="one-time-code"><button type="button" class="btn secondary" id="toggle">Show</button></div></div><button class="btn" type="submit" style="width:100%">Verify &amp; Continue</button></form><p class="subtle" style="margin-top:24px"><a href="role-selection.html">← Back</a> · <a href="#" id="logout">Sign out</a></p></section></main><script src="js/api.js"></script><script>const s=requireSession(),form=document.querySelector('#verifyForm'),message=document.querySelector('#message'),input=document.querySelector('#code');document.querySelector('#logout').onclick=e=>{e.preventDefault();logout()};document.querySelector('#toggle').onclick=e=>{input.type=input.type==='password'?'text':'password';e.target.textContent=input.type==='password'?'Show':'Hide'};form.onsubmit=async e=>{e.preventDefault();message.style.display='none';if(!input.value.trim()){message.textContent='Please enter your faculty access code.';message.style.display='block';return}const button=form.querySelector('button[type=submit]');button.disabled=true;button.textContent='Verifying…';try{const data=await api('/faculty/verify-code',{method:'POST',body:JSON.stringify({code:input.value})});const next={...s,token:data.token};localStorage.removeItem('trackerSession');sessionStorage.removeItem('trackerSession');sessionStorage.setItem('trackerSession',JSON.stringify(next));message.className='alert success';message.textContent='Verification successful. Redirecting…';message.style.display='block';setTimeout(()=>go('admin-dashboard.html'),300)}catch(error){message.textContent=error.message;message.style.display='block'}finally{button.disabled=false;button.textContent='Verify & Continue'}};</script></body></html>
