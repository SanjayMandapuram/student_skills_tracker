<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Students · SkillTrack</title><link rel="stylesheet" href="css/style.css"></head><body><div class="layout"><aside class="side"><a class="brand" href="admin-dashboard.html">✦ SkillTrack</a><nav class="nav"><a href="admin-dashboard.html">◈ &nbsp;Overview</a><a class="active" href="students.html">♙ &nbsp;Students</a><a href="admin-dashboard.html#certs">✓ &nbsp;Verification</a><a href="admin-dashboard.html#history">◷ &nbsp;History</a></nav></aside><main class="main"><div class="top"><div><div class="label">FACULTY CONSOLE</div><h1>Students</h1></div><button id="logout" class="btn secondary">Sign out</button></div><div class="card"><input id="search" class="input" placeholder="Search by name, email or student ID"></div><section class="section card"><div class="table-wrap"><table class="table"><thead><tr><th>Student</th><th>Email</th><th>Department</th><th>Skills</th><th>Certificates</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></section></main></div><script src="js/api.js"></script><script>const s=requireSession();if(s.user.role!=='ADMIN')logout();document.querySelector('#logout').onclick=logout;async function load(){const q=encodeURIComponent(document.querySelector('#search').value);try{const rows=await api('/admin/users?q='+q);document.querySelector('#rows').innerHTML=rows.length?rows.map(x=>'<tr><td>'+x.name+'</td><td>'+x.email+'</td><td>'+(x.department||'—')+'</td><td>'+x.skills+'</td><td>'+x.certificates+'</td><td><a class="btn secondary" href="student-details.html?id='+x.id+'">View</a></td></tr>').join(''):'<tr><td colspan="6" class="empty">No students found.</td></tr>'}catch(e){document.querySelector('#rows').innerHTML='<tr><td colspan="6" class="empty">'+e.message+'</td></tr>'}}document.querySelector('#search').oninput=load;load();</script></body></html>
