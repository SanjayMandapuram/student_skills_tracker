spring.application.name=student-tracker
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/student_tracker_v3;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jackson.serialization.write-dates-as-timestamps=false
app.jwt.secret=${JWT_SECRET:change-this-development-secret-to-a-long-random-value-please}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.faculty.access-code=${FACULTY_ACCESS_CODE:change-this-faculty-code}
app.cors.allowed-origins=${FRONTEND_ORIGIN:http://localhost:5500}
app.storage.local-directory=${STORAGE_LOCAL_DIRECTORY:./data/evidence}
app.notifications.cron=${NOTIFICATIONS_CRON:0 0 9 * * *}
app.notifications.timezone=${NOTIFICATIONS_TIMEZONE:Asia/Kolkata}
